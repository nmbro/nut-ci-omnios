# OmniOS r151058 CI image: the official cloud image plus NUT's build
# prerequisites (one layer) and one layer per compiler, as a qcow2 backing
# chain. Every package is pinned to its full FMRI, so a rebuild installs the
# same versions (OmniOS keeps older builds of a release in its repositories).
# Bump by hand: `pkg list -afHv <pkg>` in a running image lists the builds.

RELEASE=r151058

# https://downloads.omnios.org/media/r151058/omnios-r151058.cloud.qcow2.sha256
BASE_URL=https://downloads.omnios.org/media/r151058/omnios-r151058.cloud.qcow2
BASE_SHA256=eb36b84bbbbede5b4e7dfed931fe58d29049c02170a8e10dc7e2162d89c97f8f

# docs/config-prereqs.txt (OmniOS), plus gcc 14 (build-essential's), ccache
# and rsync (to sync the source in)
DEPS_PKGS="
pkg://omnios/developer/build-essential@11-151058.0:20260424T155917Z
pkg://omnios/developer/gcc14@14.3.0-151058.1:20261006T121232Z
pkg://omnios/developer/build/autoconf@2.72-151058.0:20260424T155947Z
pkg://omnios/developer/build/automake@1.18.1-151058.0:20260424T155954Z
pkg://omnios/developer/build/libtool@2.5.4-151058.0:20260424T171842Z
pkg://omnios/library/libtool/libltdl@2.5.4-151058.0:20260424T171904Z
pkg://omnios/developer/pkg-config@0.29.2-151058.0:20260424T171040Z
pkg://omnios/developer/versioning/git@2.53.0-151058.0:20260424T171149Z
pkg://omnios/runtime/perl@5.42.2-151058.0:20260706T122507Z
pkg://omnios/library/nspr@4.38.2-151058.0:20260424T172126Z
pkg://omnios/system/library/mozilla-nss@3.122-151058.0:20260424T180756Z
pkg://omnios/library/security/openssl-3@3.6.5-151058.0:20261001T185453Z
pkg://omnios/system/management/snmp/net-snmp@5.9.5.2-151058.0:20260424T164527Z
pkg://omnios/network/rsync@3.5.0-151058.0:20260924T173847Z
pkg://extra.omnios/ooce/developer/ccache@3.6-151058.0:20260411T075922Z
pkg://extra.omnios/ooce/library/libgd@2.3.3-151058.0:20260411T100925Z
pkg://extra.omnios/ooce/library/libusb-1@1.0.30-151058.0:20260920T172644Z
"

# One layer per compiler the NUT CI farm's OmniOS agents build with,
# each on top of the deps layer: name=FMRI
COMPILERS="
clang-13=pkg://extra.omnios/ooce/developer/clang-13@13.0.1-151058.0:20260411T082143Z
clang-17=pkg://extra.omnios/ooce/developer/clang-17@17.0.6-151058.0:20260411T151932Z
clang-20=pkg://extra.omnios/ooce/developer/clang-20@20.1.8-151058.0:20260411T173330Z
clang-22=pkg://extra.omnios/ooce/developer/clang-22@22.1.8-151058.0:20260705T173806Z
gcc-15=pkg://omnios/developer/gcc15@15.2.0-151058.1:20261006T115300Z
"
