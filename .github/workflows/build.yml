# Reusable: build the OmniOS CI image chain for one release, push it to GHCR
# as OCI artifacts (one manifest per compiler, sharing the base and deps
# blobs), and attest each manifest: SLSA build provenance and an SPDX SBOM,
# both pushed next to the image. Being a reusable workflow, the attestations'
# signer identity is this file, so consumers can require exactly it:
#   gh attestation verify oci://ghcr.io/<owner>/nut-ci-omnios@sha256:<digest> \
#     --repo <owner>/nut-ci-omnios \
#     --signer-workflow <owner>/nut-ci-omnios/.github/workflows/build.yml
# The layers, the package lists and the file lists are blobs of the manifest,
# so its digest covers all of them. See image/ and README.md.
name: "OmniOS CI image: build (reusable)"

on:
  workflow_call:
    inputs:
      release:
        description: "OmniOS release: the name of an image/<release>.conf"
        type: string
        required: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      variants: ${{ steps.push.outputs.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU and cloud-localds, open /dev/kvm
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          qemu-system-x86_64 --version | head -1

      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.6

      - name: Build the layers
        env:
          RELEASE: ${{ inputs.release }}
        run: bash image/build.sh "image/$RELEASE.conf" "$RUNNER_TEMP/img"

      - name: Push to GHCR, one manifest per compiler
        id: push
        env:
          RELEASE: ${{ inputs.release }}
          REPO: ghcr.io/${{ github.repository_owner }}/nut-ci-omnios
          # GHCR shows the package's description from the last pushed
          # manifest, so it is the same for every variant; the variant is in
          # the title and version annotations
          DESCRIPTION: >-
            OmniOS VM images for Network UPS Tools CI on GitHub-hosted runners.
            Each tag is a qcow2 chain: the official OmniOS cloud image, NUT's
            build prerequisites, and one compiler. Boot the layer named in
            io.github.nut-ci.omnios.top, from a throwaway overlay. Built with
            SLSA provenance and an SPDX SBOM.
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090
          . "image/$RELEASE.conf"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
          cd "$RUNNER_TEMP/img/out"
          created=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%cI | TZ=UTC date -f - +%Y-%m-%dT%H:%M:%SZ)
          L=application/vnd.nut-ci.omnios.layer.v1+qcow2
          T=text/plain
          variants='[]'
          for entry in $COMPILERS; do
            name=${entry%%=*}
            SBOM_CREATED=$created python3 "$GITHUB_WORKSPACE/image/mkspdx.py" \
              "$RELEASE-$name" "$name.pkgs.txt" "$BASE_URL" "$BASE_SHA256" > "$name.spdx.json"
            digest=$(oras push "$REPO:$RELEASE-$name" \
              --artifact-type application/vnd.nut-ci.omnios.image.v1 \
              --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "org.opencontainers.image.created=$created" \
              --annotation "org.opencontainers.image.title=nut-ci-omnios $RELEASE $name" \
              --annotation "org.opencontainers.image.description=$DESCRIPTION" \
              --annotation "org.opencontainers.image.url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY#readme" \
              --annotation "org.opencontainers.image.version=$RELEASE-$name" \
              --annotation "io.github.nut-ci.omnios.base-url=$BASE_URL" \
              --annotation "io.github.nut-ci.omnios.base-sha256=$BASE_SHA256" \
              --annotation "io.github.nut-ci.omnios.top=$name.c.qcow2" \
              --annotation "io.github.nut-ci.omnios.run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "base.c.qcow2:$L" "nut-deps.c.qcow2:$L" "$name.c.qcow2:$L" \
              "nut-deps.pkgs.txt:$T" "nut-deps.files.txt:$T" "$name.pkgs.txt:$T" "$name.files.txt:$T" \
              --format go-template='{{.digest}}')
            echo "$REPO:$RELEASE-$name@$digest"
            variants=$(jq -c --arg n "$name" --arg d "$digest" '. + [{name: $n, digest: $d}]' <<< "$variants")
          done
          echo "variants=$variants" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/sbom" && cp ./*.spdx.json "$RUNNER_TEMP/sbom/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        variant: ${{ fromJSON(needs.build.outputs.variants) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Log in to GHCR (attestations are pushed next to the image)
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/nut-ci-omnios
          subject-digest: ${{ matrix.variant.digest }}
          push-to-registry: true

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/nut-ci-omnios
          subject-digest: ${{ matrix.variant.digest }}
          sbom-path: sbom/${{ matrix.variant.name }}.spdx.json
          push-to-registry: true
